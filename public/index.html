<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Teleprompter minimalista para celular e tablet.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Teleprompter">
  <meta name="format-detection" content="telephone=no">
  <title>Teleprompter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/prompter.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Cada módulo monta a própria interface dentro do seu ponto de montagem (ver docs/ESPECIFICACAO.md, seção 11). -->
  <main id="editor-screen" class="screen" aria-label="Editor do roteiro"></main>
  <section id="prompter-screen" class="screen" aria-label="Teleprompter" hidden></section>
  <div id="panel-root"></div>
  <div id="dialog-root"></div>
  <noscript>Ative o JavaScript para usar o teleprompter.</noscript>
</body>
</html>
